spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bankcards}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  security:
    basic:
      enabled: false

jwt:
  secret: mySuperSecretKeyForJwtGeneration123!@#456
  expiration: 86400000

card:
  encryption:
    secret: myCardEncryptionSecretKey123!@#456

server:
  port: 8080

admin:
  username: user
  password: pass
