spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bankcards}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  security:
    basic:
      enabled: false

# Secrets are supplied through the environment on purpose: there is no default,
# so the application refuses to start rather than run with a known key.
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

card:
  encryption:
    secret: ${CARD_ENCRYPTION_SECRET}

server:
  port: 8080

admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}
